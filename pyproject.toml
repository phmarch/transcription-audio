[project]
name = "transcription-audio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets[audio]>=4.8.4",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "soundfile>=0.13.1",
    "httpx>=0.28.1",
    "openai>=2.32.0",
]

[dependency-groups]
cuda = [
    "nvidia-cudnn-cu12; platform_machine != 'arm64'",
    "nvidia-cublas-cu12; platform_machine != 'arm64'",
    "nvidia-nccl-cu12; platform_machine != 'arm64'",
    "nvidia-cuda-runtime-cu12; platform_machine != 'arm64'",
]

batchalign2 = [
    "batchalign>=0.8.2.post13",
    "huggingface-hub>=0.34.0,<1.0",
]



vllm = [
    "vllm>=0.19; sys_platform == 'linux' and platform_machine == 'x86_64'",
    {include-group = "cuda"},
]


crisper = [
    "transformers @ git+https://github.com/nyrahealth/transformers.git@crisper_whisper",
]

[tool.uv]
default-groups = []
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

conflicts = [
    [
        { group = "batchalign2" },
        { group = "crisper" },
        { group = "vllm" },
    ],
]

[tool.uv.workspace]
members = [
    "runners/batchalign3",
]
